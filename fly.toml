app = "stpt-admin"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "stpt_data"
  destination = "/data"
  initial_size = "1gb"

[env]
  DB_PATH = "/data/stpt.db"
