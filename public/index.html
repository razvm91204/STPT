<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STPT Timișoara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root {
    --purple:       #5c4fd5;
    --purple-dark:  #4338b0;
    --purple-light: #ede9fd;
    --purple-muted: #8b7ee8;
    --bg:           #f2eff9;
    --surface:      #ffffff;
    --border:       #e4dff4;
    --text:         #1a1235;
    --muted:        #7a6fa8;
    --dark:         #12102b;
    --accent:       #5c4fd5;
    --accent-light: #ede9fd;
    --accent-text:  #4338b0;
    --warn:         #92400e;
    --warn-light:   #fef3c7;
    --tram-bg: #fef3c7; --tram-text: #78350f; --tram-border: #fcd34d;
    --trol-bg: #d1fae5; --trol-text: #064e3b; --trol-border: #6ee7b7;
    --bus-bg:  #dbeafe; --bus-text:  #1e3a5f; --bus-border:  #93c5fd;
    --met-bg:  #ede9fd; --met-text:  #4338b0; --met-border:  #8b7ee8;
  }
  .leaflet-control-zoom, .leaflet-control-attribution{
	display:none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100%; font-size: 15px; line-height: 1.5; overflow: hidden; display: flex; flex-direction: column; position: relative; }

  /* ── NAV ───────────────────────────────────────────────────────────────── */
  .topnav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 100;
    height: 60px; padding: 0 2.5rem;
    background: transparent;
    display: flex; align-items: center;
    pointer-events: none;
  }
  .nav-logo, .nav-link, .nav-icon-btn { pointer-events: auto; }
  .nav-inner { display: flex; align-items: center; width: 100%; gap: 2rem; }
  .nav-logo { height: 62px; width: auto; flex-shrink: 0; display: block; margin-top: 28px; margin-left: 1.5rem; }
  .nav-links { display: flex; gap: 0; flex: 1; justify-content: center; }
  .nav-link {
    padding: 6px 16px; font-size: 14px; font-weight: 400;
    color: var(--muted); cursor: pointer; border: none; background: none;
    font-family: 'Inter', sans-serif; transition: color 0.15s; position: relative;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link.active { color: var(--text); font-weight: 600; }
  .nav-link.active::after {
    content: ''; position: absolute; bottom: -2px; left: 16px; right: 16px;
    height: 2px; border-radius: 2px; background: var(--purple);
  }
  .nav-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .nav-icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .nav-icon-btn:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-light); }
  #theme-toggle {
    position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 500;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--muted); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(18,16,43,.15); transition: all 0.15s;
    pointer-events: auto;
  }
  #theme-toggle:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-light); }

  /* ── DARK MODE ─────────────────────────────────────────────────────────── */
  html.dark {
    --bg:           #12102b;
    --surface:      #1c1835;
    --border:       #2d2654;
    --text:         #eeeaf8;
    --muted:        #9d93c8;
    --dark:         #eeeaf8;
    --purple-light: #252048;
    --warn-light:   #2d1f05;
  }
  html.dark .hero {
    background-image: url('hero_bg_dark.png'), linear-gradient(var(--bg), var(--bg));
  }
  html.dark .hero-cta-btn {
    background: rgba(28,24,53,0.88); color: var(--purple-muted); border-color: rgba(139,126,232,0.3);
  }
  html.dark .planner-card {
    box-shadow: 0 8px 48px rgba(0,0,0,.45), 0 2px 12px rgba(0,0,0,.3);
  }
  html.dark .map-live-badge {
    background: rgba(28,24,53,.95); color: #4ade80;
  }
  html.dark .nav-logo { filter: brightness(0) invert(1); }
  html.dark .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) saturate(0.6) brightness(0.85);
  }
  html.dark .map-gradient-overlay { opacity: 0.2; }
  html.dark .map-pin-btn {
    background: rgba(18,16,43,.92); border-color: rgba(139,126,232,.35); color: var(--muted);
  }
  html.dark .map-pin-btn.active-from { background: rgba(40,18,10,.92); border-color: #c2500a; color: #e07840; }
  html.dark .map-pin-btn.active-to   { background: rgba(40,10,10,.92); border-color: #e74c3c; color: #e87070; }

  /* ── HERO ──────────────────────────────────────────────────────────────── */
  .hero {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; align-items: stretch;
    background: url('hero_bg.png') left center/auto 100% no-repeat, var(--bg);
    position: relative;
  }
  .hero-content {
    flex: 1; min-width: 0;
    position: relative; z-index: 2; display: flex; align-items: flex-start;
  }
  .hero-inner {
    position: relative; z-index: 1;
    display: flex; align-items: flex-start; justify-content: space-between;
    width: 100%; padding: calc(60px + 1.5rem) 0 0 clamp(1.5rem, 11vw, 10rem); gap: 2rem;
  }

  /* ── HERO LEFT ─────────────────────────────────────────────────────────── */
  .hero-left { color: var(--dark); flex-shrink: 0; max-width: 380px; margin-top: clamp(2rem, 8vh, 8rem); }
  .hero-title {
    font-size: clamp(42px, 5vw, 70px); font-weight: 800;
    line-height: 1.04; letter-spacing: -0.04em; margin-bottom: 1.25rem;
  }
  .hero-title em { color: var(--purple); font-style: normal; display: block; }
  .hero-sub { font-size: 16px; color: var(--dark); line-height: 1.75; margin-bottom: 5px; }
  .hero-cta-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    background: rgba(255,255,255,0.88); color: var(--purple);
    padding: 14px 20px; border-radius: 50px;
    border: 1.5px solid rgba(92,79,213,0.2);
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    backdrop-filter: blur(8px);
  }
  .hero-cta-btn:hover { background: rgba(255,255,255,1); transform: translateY(-1px); }
  .hero-cta-arrow { font-size: 18px; opacity: 0.7; margin-left: 12px; }

  /* ── PLANNER CARD ──────────────────────────────────────────────────────── */
  .planner-card {
    background: var(--surface); border-radius: 22px; padding: 1.1rem 1.25rem;
    box-shadow: 0 8px 48px rgba(18,16,43,.18), 0 2px 12px rgba(18,16,43,.1);
    max-height: calc(100vh - 110px); overflow-y: auto; box-sizing: border-box;
    scrollbar-width: none;
    width: 420px; flex-shrink: 0; margin-right: -24px;
  }
  .planner-card::-webkit-scrollbar { display: none; }
  .planner-card.card-full { height: calc(100vh - 110px); }
  .planner-inputs { background: var(--bg); border-radius: 14px; border: 1px solid var(--border); padding: 2px 0; margin-bottom: 12px; }
  .planner-input-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .input-dot { flex-shrink: 0; font-size: 10px; line-height: 1; }
  .dot-from { color: var(--purple); }
  .dot-to   { color: var(--text); font-size: 8px; }
  .planner-divider { display: flex; align-items: center; padding: 0 12px; }
  .planner-divider-line { flex: 1; height: 1px; background: var(--border); }
  .swap-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.15s;
  }
  .swap-btn:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-light); }
  .planner-input {
    flex: 1; border: none !important; background: transparent !important; outline: none;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--text);
    height: 28px !important; padding: 0 !important;
  }
  .planner-input::placeholder { color: var(--muted); font-weight: 400; }

  .planner-row-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .planner-select {
    height: 40px; padding: 0 12px; width: 100%;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 13px;
    appearance: none; -webkit-appearance: none; outline: none; cursor: pointer;
    transition: border-color 0.15s;
  }
  .planner-select:focus { border-color: var(--purple); }
  input[type="time"]::-webkit-datetime-edit-ampm-field { display: none; }
  input[type="time"] { -webkit-appearance: none; }
  .search-btn {
    width: 100%; height: 44px; margin-bottom: 1rem;
    background: var(--purple); color: #fff; border: none; border-radius: 11px;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .search-btn:hover { background: var(--purple-dark); }

  /* ── RESULTS ───────────────────────────────────────────────────────────── */
  .results-section-title { font-size: 13px; font-weight: 600; color: var(--text); margin: 4px 0 10px; }
  .result-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .result-card.best { border-color: var(--purple); box-shadow: 0 2px 10px rgba(92,79,213,.12); }
  .result-card:hover { border-color: var(--purple-muted); box-shadow: 0 2px 8px rgba(92,79,213,.08); }
  .result-card.late-route { border-left: 3px solid #e74c3c; opacity: 0.82; }
  .result-header { display: flex; align-items: center; gap: 10px; }
  .line-badge {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
    border: 1.5px solid; gap: 1px; font-variant-numeric: tabular-nums;
  }
  .line-badge.bus  { background: var(--bus-bg);  color: var(--bus-text);  border-color: var(--bus-border); }
  .line-badge.tram { background: var(--tram-bg); color: var(--tram-text); border-color: var(--tram-border); }
  .line-badge.trol { background: var(--trol-bg); color: var(--trol-text); border-color: var(--trol-border); }
  .line-badge.met  { background: var(--met-bg);  color: var(--met-text);  border-color: var(--met-border); }
  .badge-sub { font-size: 7px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.7; font-weight: 600; }
  .result-body { flex: 1; min-width: 0; }
  .result-title { font-size: 13px; font-weight: 500; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .result-right { text-align: right; flex-shrink: 0; }
  .result-duration { font-size: 16px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .result-times { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
  .pill { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-bottom: 5px; letter-spacing: 0.04em; text-transform: uppercase; }
  .pill-green  { background: var(--purple-light); color: var(--purple-dark); }
  .pill-yellow { background: var(--warn-light); color: var(--warn); }
  .pill-red    { background: #fde8e8; color: #c0392b; }
  .pill-nearby { background: var(--bus-bg); color: var(--bus-text); }
  .late-section-label { font-size: 11px; font-weight: 600; color: #c0392b; letter-spacing: 0.06em; text-transform: uppercase; margin: 12px 0 6px 2px; }
  .nearby-banner { background: var(--purple-light); border: 1px solid var(--purple-muted); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--purple-dark); margin-bottom: 8px; line-height: 1.5; }
  .fav-btn { background: none; border: 1px solid var(--border); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--muted); font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; margin-left: 4px; }
  .fav-btn:hover { background: var(--warn-light); color: var(--warn); border-color: #fcd34d; }
  .stops-toggle { font-size: 11px; color: var(--purple); cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; background: none; border: none; padding: 0; font-family: 'Inter', sans-serif; }
  .stops-toggle:hover { text-decoration: underline; }
  .stops-list { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: none; }
  .stops-list.open { display: block; }
  .stop-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 12px; }
  .stop-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); border: 1.5px solid var(--muted); flex-shrink: 0; }
  .stop-dot.highlight { background: var(--purple); border-color: var(--purple); }
  .stop-line { width: 2px; height: 12px; background: var(--border); flex-shrink: 0; }
  .stop-time { font-size: 11px; color: var(--muted); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .stop-name { flex: 1; }
  .stop-name.active-stop { font-weight: 500; color: var(--text); }
  .empty-state { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 13px; }
  .empty-icon { font-size: 24px; margin-bottom: 0.75rem; }

  /* ── MAP COLUMN ─────────────────────────────────────────────────────────── */
  .hero-map-col {
    width: 38%; flex-shrink: 0; position: relative; z-index: 1;
    mask-image: linear-gradient(to right, transparent 0%, black 18%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 18%);
  }
  .hero::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(to bottom, transparent 50%, var(--bg) 100%);
    mask-image: linear-gradient(to right, transparent 45%, black 68%);
    -webkit-mask-image: linear-gradient(to right, transparent 45%, black 68%);
  }
  .leaflet-tile-pane { filter: saturate(0.72) hue-rotate(155deg) brightness(1.04); }
  .map-gradient-overlay {
    position: absolute; inset: 0; z-index: 800; pointer-events: none;
    background: url('gradient_map.png') center/cover no-repeat;
    mix-blend-mode: color; opacity: 0.4;
  }
  .map-header { position: absolute; top: 14px; right: 14px; z-index: 400; }
  .map-live-badge { background: rgba(255,255,255,.95); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: #16a34a; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
  #map { width: 100%; height: 100%; min-height: 0; border-radius: 0; border: none; display: block; }
  #map-hint { display: none; }
  .map-pin-group {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 400;
    display: flex; gap: 8px;
  }
  .map-pin-btn {
    background: rgba(255,255,255,.95); border: 1.5px solid rgba(0,0,0,.14);
    border-radius: 20px; padding: 8px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif; color: var(--muted);
    box-shadow: 0 2px 8px rgba(0,0,0,.14); transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .map-pin-btn:hover { border-color: var(--purple); color: var(--purple); }
  .map-pin-btn.active-from { border-color: #c2500a; color: #c2500a; background: rgba(255,247,243,.98); }
  .map-pin-btn.active-to   { border-color: #e74c3c; color: #e74c3c; background: rgba(255,245,245,.98); }

  /* ── SECONDARY SECTIONS ─────────────────────────────────────────────────── */
  .secondary-section { flex: 1; min-height: 0; overflow-y: auto; max-width: 780px; width: 100%; margin: 0 auto; padding: 2rem 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  .card-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.25rem; }
  .fav-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .fav-item:last-child { border-bottom: none; }
  .fav-label { font-size: 14px; font-weight: 500; }
  .fav-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fav-actions { display: flex; gap: 6px; }
  .icon-btn { background: none; border: 1px solid var(--border); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; color: var(--muted); font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn.danger:hover { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .line-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .line-row:last-child { border-bottom: none; }
  .line-info { flex: 1; min-width: 0; }
  .line-name { font-size: 14px; font-weight: 500; }
  .tip-pill { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px; }

  /* ── AUTOCOMPLETE ───────────────────────────────────────────────────────── */
  .autocomplete-wrap { position: relative; flex: 1; }
  .autocomplete-input {
    width: 100%; height: 40px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.15s;
  }
  .autocomplete-input:focus { border-color: var(--purple); }
  .suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 300;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(18,16,43,.15); max-height: 220px; overflow-y: auto; display: none;
  }
  .suggestions.open { display: block; }
  .suggestion { padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); transition: background .1s; }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover, .suggestion.focused { background: var(--purple-light); }

  /* ── RESPONSIVE ────────────────────────────────────────────────────────── */
  @media (max-width: 1200px) {
    .hero-left { display: none; }
    .hero-inner { justify-content: flex-end; padding-left: 2rem; }
    .planner-card { width: min(420px, 48vw); }
  }
  @media (max-width: 960px) {
    .topnav {
      position: static; height: auto;
      padding: 0 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      pointer-events: auto;
    }
    .nav-inner { gap: 0.25rem; }
    .nav-logo { margin-top: 0; margin-left: 0.25rem; height: 36px; }
    .nav-links { display: flex; gap: 0; }
    .nav-link { padding: 4px 10px; font-size: 12px; }
    .nav-link.active::after { bottom: -1px; left: 10px; right: 10px; }
    #theme-toggle {
      position: static; width: 32px; height: 32px;
      font-size: 15px; box-shadow: none; border-radius: 8px; flex-shrink: 0;
    }
    .hero { flex-direction: column; overflow-y: auto; align-items: center; }
    .hero-content { flex: none; width: 100%; }
    .hero-inner {
      padding: 2rem 1.25rem 2rem;
      justify-content: center; align-items: flex-start;
      flex-direction: column;
    }
    .hero-left { display: none; }
    .hero-map-col { display: none; }
    .planner-card {
      width: 100%; max-width: 500px; margin: 0 auto;
      max-height: none; height: auto !important;
      border-radius: 18px; margin-right: 0;
    }
    .hero::before { display: none; }
  }
  @media (max-width: 520px) {
    .planner-row-bottom { grid-template-columns: 1fr; }
    .planner-card { border-radius: 14px; }
    .hero-inner { padding: calc(60px + 1.25rem) 1rem 1.5rem; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-inner">
    <img src="stpt_logo.png" class="nav-logo" alt="STPT">
    <div class="nav-links">
      <button class="nav-link active" data-section="plan"  onclick="UiModule.showTab('plan')">Planifică rută</button>
      <button class="nav-link"        data-section="linii" onclick="UiModule.showTab('linii')">Linii</button>
      <button class="nav-link"        data-section="favs"  onclick="UiModule.showTab('favs')">Favorite</button>
    </div>
    <div class="nav-actions">
      <button id="theme-toggle" onclick="toggleTheme()" title="Schimbă tema">&#9790;</button>
    </div>
  </div>
</nav>

<section class="hero" id="section-plan">

  <div class="hero-content">
    <div class="hero-inner">

      <div class="hero-left">
        <h1 class="hero-title">Timișoara<em>în mișcare.</em></h1>
        <p class="hero-sub">Planifică-ți călătoria cu STPT<br>rapid, simplu, oriunde te-ai afla.</p>
        <button class="hero-cta-btn" onclick="UiModule.showTab('plan'); document.getElementById('from-input').focus()">
          <span>&#128506;&nbsp;&nbsp;Planifică o rută</span>
          <span class="hero-cta-arrow">&rarr;</span>
        </button>
      </div>

      <div class="planner-card">
        <div id="card-plan">
          <div class="planner-inputs">
            <div class="planner-input-row">
              <span class="input-dot dot-from">&#9679;</span>
              <div class="autocomplete-wrap">
                <input type="text" class="autocomplete-input planner-input" id="from-input" placeholder="De la" autocomplete="off">
                <div class="suggestions" id="from-sug"></div>
              </div>
            </div>
            <div class="planner-divider">
              <div class="planner-divider-line"></div>
              <button class="swap-btn" onclick="UiModule.swap()" title="Inversează">&#8645;</button>
              <div class="planner-divider-line"></div>
            </div>
            <div class="planner-input-row">
              <span class="input-dot dot-to">&#9632;</span>
              <div class="autocomplete-wrap">
                <input type="text" class="autocomplete-input planner-input" id="to-input" placeholder="Până la" autocomplete="off">
                <div class="suggestions" id="to-sug"></div>
              </div>
            </div>
          </div>

          <div class="planner-row-bottom">
            <select id="sel-day" class="planner-select">
              <option value="school">Zi școlară</option>
              <option value="vacation">Vacanță</option>
              <option value="holiday">Duminică / Sărbătoare</option>
            </select>
            <input type="time" id="sel-time" class="planner-select" value="08:00">
          </div>
          <button class="search-btn" onclick="AppModule.cauta()">Caută rută &rarr;</button>

          <div id="results"></div>
        </div>

        <div id="card-linii" style="display:none"><div id="all-lines"></div></div>
        <div id="card-favs"  style="display:none"><div id="favs-list"></div></div>
      </div>

    </div>
  </div>

  <div class="hero-map-col">
    <div class="map-header">
      <span class="map-live-badge">&#9679; Hartă</span>
    </div>
    <div id="map"></div>
    <div class="map-gradient-overlay"></div>
    <div id="map-hint"></div>
    <div class="map-pin-group">
      <button id="btn-set-from" class="map-pin-btn active-from" onclick="MapModule.setMode('from')">&#9679; De la</button>
      <button id="btn-set-to"   class="map-pin-btn" onclick="MapModule.setMode('to')">&#9632; Până la</button>
    </div>
  </div>

</section>



<script>
  (function() {
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  })();

  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('theme-toggle').innerHTML = isDark ? '&#9728;' : '&#9790;';
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (document.documentElement.classList.contains('dark')) {
      document.getElementById('theme-toggle').innerHTML = '&#9728;';
    }
  });
</script>
<script src="network_data.js"></script>
<script src="stations_coords.js"></script>
<script src="js/data.js"></script>
<script src="js/schedule.js"></script>
<script src="js/routing.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>

</body>
</html>
